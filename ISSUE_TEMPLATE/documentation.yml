---
name: Documentation improvement
description: Suggest a documentation correction or improvement
title: "[Docs]: "
labels:
  - documentation
body:
  - type: textarea
    id: page
    attributes:
      label: Page or section
      description: Which file, page or section needs improvement?
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What should change?
      description: Explain what is unclear, outdated or missing.
    validations:
      required: true

  - type: textarea
    id: suggested
    attributes:
      label: Suggested wording
      description: Optional replacement text.
    validations:
      required: false
